[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasitic"
version = "0.1.0"
description = "Python reconstruction of ASITIC for the browser"
requires-python = ">=3.11"

[project.scripts]
reasitic = "reasitic.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasitic = ["*.tek", "technologies/*.tek", "technologies/*.json", "technologies/*.txt"]
