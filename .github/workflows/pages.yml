name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    name: Package Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      potential_matrix: ${{ steps.plan.outputs.potential_matrix }}
      core_matrix: ${{ steps.plan.outputs.core_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan every Python check with eight complete disjoint core shards
        id: plan
        run: python tools/run_python_checks.py plan >> "$GITHUB_OUTPUT"
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.js && node --check web/worker.js && node --check web/analysis-views.mjs && node tools/check_analysis_views.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  python-core:
    name: Python · core ${{ matrix.shard }} / ${{ matrix.shards }}
    needs: build
    runs-on: ubuntu-latest
    # A complete 256x256 portable inverse plus its shard exceeded 40 minutes
    # on a hosted runner; retain every check and allow it to finish.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.core_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdstk==1.0.2
      - run: python -u tools/run_python_checks.py core --shard '${{ matrix.shard }}' --shards '${{ matrix.shards }}' --ids-sha '${{ matrix.ids_sha }}'
  kernel-build:
    name: Rebuild retained-precision WebAssembly kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_kernels.py --download-zig --verify
      - run: python tools/build_site.py && python tools/check_kernel_sources.py
  python-tables:
    name: Python · FFT tables · ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.potential_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native FFT and CAP references with live case progress
        run: python -u tools/run_python_checks.py potential --process '${{ matrix.process }}' --frequency '${{ matrix.frequency }}'
  wasm:
    name: WebAssembly · ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, dependencies, resonance, extended, technologies, fft, matrix, contacts, general, spectral, transformer, composition, splitting, storage, geometry, heap, mappings, shared, inductive, prelude, prestorage, libio, cachestore, driverhist, console, nodehistory, commandtransition, signalframes, signalinstall, loaderlookup, pltfixup, loadertransition, dispatchstore, pollstore, stdiotransition, inputtransition, fileallocation, stattransition, mallocstore, malloctransition, readstore, readtransition, getlinebytes, getlinetransition, flushstore, flushtransition, capstorage, workspaces, history, filaments, mutual, eddy, metrics]
        include:
          - {suite: erasure, shard: 1, shards: 4}
          - {suite: erasure, shard: 2, shards: 4}
          - {suite: erasure, shard: 3, shards: 4}
          - {suite: erasure, shard: 4, shards: 4}
          - {suite: printfbuffer, shard: 1, shards: 8}
          - {suite: printfbuffer, shard: 2, shards: 8}
          - {suite: printfbuffer, shard: 3, shards: 8}
          - {suite: printfbuffer, shard: 4, shards: 8}
          - {suite: printfbuffer, shard: 5, shards: 8}
          - {suite: printfbuffer, shard: 6, shards: 8}
          - {suite: printfbuffer, shard: 7, shards: 8}
          - {suite: printfbuffer, shard: 8, shards: 8}
          - {suite: printffile, shard: 1, shards: 8}
          - {suite: printffile, shard: 2, shards: 8}
          - {suite: printffile, shard: 3, shards: 8}
          - {suite: printffile, shard: 4, shards: 8}
          - {suite: printffile, shard: 5, shards: 8}
          - {suite: printffile, shard: 6, shards: 8}
          - {suite: printffile, shard: 7, shards: 8}
          - {suite: printffile, shard: 8, shards: 8}
          - {suite: vfprintf, shard: 1, shards: 8}
          - {suite: vfprintf, shard: 2, shards: 8}
          - {suite: vfprintf, shard: 3, shards: 8}
          - {suite: vfprintf, shard: 4, shards: 8}
          - {suite: vfprintf, shard: 5, shards: 8}
          - {suite: vfprintf, shard: 6, shards: 8}
          - {suite: vfprintf, shard: 7, shards: 8}
          - {suite: vfprintf, shard: 8, shards: 8}
          - {suite: printf-format, shard: 1, shards: 8}
          - {suite: printf-format, shard: 2, shards: 8}
          - {suite: printf-format, shard: 3, shards: 8}
          - {suite: printf-format, shard: 4, shards: 8}
          - {suite: printf-format, shard: 5, shards: 8}
          - {suite: printf-format, shard: 6, shards: 8}
          - {suite: printf-format, shard: 7, shards: 8}
          - {suite: printf-format, shard: 8, shards: 8}
          - {suite: printf-integer}
          - {suite: printf-float-digits}
          - {suite: x87-formatter-state}
          - {suite: printf-instruction-flags}
          - {suite: vfprintf-whole, shard: 1, shards: 8}
          - {suite: vfprintf-whole, shard: 2, shards: 8}
          - {suite: vfprintf-whole, shard: 3, shards: 8}
          - {suite: vfprintf-whole, shard: 4, shards: 8}
          - {suite: vfprintf-whole, shard: 5, shards: 8}
          - {suite: vfprintf-whole, shard: 6, shards: 8}
          - {suite: vfprintf-whole, shard: 7, shards: 8}
          - {suite: vfprintf-whole, shard: 8, shards: 8}
          - {suite: printf-entry, shard: 1, shards: 8}
          - {suite: printf-entry, shard: 2, shards: 8}
          - {suite: printf-entry, shard: 3, shards: 8}
          - {suite: printf-entry, shard: 4, shards: 8}
          - {suite: printf-entry, shard: 5, shards: 8}
          - {suite: printf-entry, shard: 6, shards: 8}
          - {suite: printf-entry, shard: 7, shards: 8}
          - {suite: printf-entry, shard: 8, shards: 8}
          - {suite: printf-transition, shard: 1, shards: 8}
          - {suite: printf-transition, shard: 2, shards: 8}
          - {suite: printf-transition, shard: 3, shards: 8}
          - {suite: printf-transition, shard: 4, shards: 8}
          - {suite: printf-transition, shard: 5, shards: 8}
          - {suite: printf-transition, shard: 6, shards: 8}
          - {suite: printf-transition, shard: 7, shards: 8}
          - {suite: printf-transition, shard: 8, shards: 8}
          - {suite: select-dispatch, shard: 1, shards: 1}
          - {suite: kill-storage, shard: 1, shards: 1}
          - {suite: kill-delivery, shard: 1, shards: 1}
          - {suite: parser-callers, shard: 1, shards: 1}
          - {suite: unjoin-assembly, shard: 1, shards: 1}
          - {suite: breakup, shard: 1, shards: 1}
          - {suite: shunt, shard: 1, shards: 1}
          - {suite: phase-origin, shard: 1, shards: 1}
          - {suite: shunt-storage, shard: 1, shards: 1}
          - {suite: shunt-filaments, shard: 1, shards: 1}
          - {suite: shunt-driver, shard: 1, shards: 1}
          - {suite: shunt-node, shard: 1, shards: 1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/reasitic-pyodide pyodide@314.0.7 jsdom@26.1.0
      - name: Run pinned WebAssembly validation group
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          case "$SUITE" in
            baseline|dependencies|resonance)
              node tools/check_pyodide.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs "$SUITE" ;;
            extended)
              node tools/check_extended.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            technologies)
              node tools/check_technologies.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            fft)
              node tools/check_potential_fft.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            matrix)
              node tools/check_matrix_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            contacts)
              node tools/check_contact_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            general)
              node tools/check_general_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            spectral)
