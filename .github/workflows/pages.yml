name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdstk==1.0.2
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.js && node --check web/worker.js && node --check web/analysis-views.mjs && node tools/check_analysis_views.mjs
      - run: npm install --prefix /tmp/reasitic-pyodide pyodide@314.0.7
      - run: node tools/check_pyodide.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
      - run: node tools/check_extended.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
