name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    name: Package Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      potential_matrix: ${{ steps.plan.outputs.potential_matrix }}
      core_matrix: ${{ steps.plan.outputs.core_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan every Python check with eight complete disjoint core shards
        id: plan
        run: python tools/run_python_checks.py plan >> "$GITHUB_OUTPUT"
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.js && node --check web/worker.js && node --check web/analysis-views.mjs && node tools/check_analysis_views.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  python-core:
    name: Python · core ${{ matrix.shard }} / ${{ matrix.shards }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.core_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdstk==1.0.2
      - run: python -u tools/run_python_checks.py core --shard '${{ matrix.shard }}' --shards '${{ matrix.shards }}' --ids-sha '${{ matrix.ids_sha }}'
  kernel-build:
    name: Rebuild retained-precision WebAssembly kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_kernels.py --download-zig --verify
      - run: python tools/build_site.py && python tools/check_kernel_sources.py
  python-tables:
    name: Python · FFT tables · ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.potential_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native FFT and CAP references with live case progress
        run: python -u tools/run_python_checks.py potential --process '${{ matrix.process }}' --frequency '${{ matrix.frequency }}'
  wasm:
    name: WebAssembly · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, dependencies, resonance, extended, technologies, fft, matrix, contacts, general, spectral, transformer, filaments, mutual, eddy, metrics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/reasitic-pyodide pyodide@314.0.7 jsdom@26.1.0
      - name: Run pinned WebAssembly validation group
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            baseline|dependencies|resonance)
              node tools/check_pyodide.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs "$SUITE" ;;
            extended)
              node tools/check_extended.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            technologies)
              node tools/check_technologies.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            fft)
              node tools/check_potential_fft.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            matrix)
              node tools/check_matrix_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            contacts)
              node tools/check_contact_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            general)
              node tools/check_general_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            spectral)
              node tools/check_spectral_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            transformer)
              node tools/check_nodes.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_transformer.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            filaments)
              node tools/check_filaments.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_mesh.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            mutual)
              node tools/check_mutual_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_vias.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            eddy)
              node tools/check_layered_green.mjs
              node tools/check_eddy_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            metrics)
              node tools/check_assembly_geometry.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_ring_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_square_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_polygon_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_resistance_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_network_metrics.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_pi_sessions.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_frequency_inputs.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            *) exit 1 ;;
          esac
  deploy:
    name: Deploy validated Pages
    needs: [build, python-core, kernel-build, python-tables, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Advance the published version without rollback
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pages_promotion.py
      - name: Deploy
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
