name: Test and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    name: Package Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      potential_matrix: ${{ steps.plan.outputs.potential_matrix }}
      core_matrix: ${{ steps.plan.outputs.core_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan every Python check with eight complete disjoint core shards
        id: plan
        run: python tools/run_python_checks.py plan >> "$GITHUB_OUTPUT"
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check web/app.js && node --check web/worker.js && node --check web/analysis-views.mjs && node tools/check_analysis_views.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  python-core:
    name: Python · core ${{ matrix.shard }} / ${{ matrix.shards }}
    needs: build
    runs-on: ubuntu-latest
    # A complete 256x256 portable inverse plus its shard exceeded 40 minutes
    # on a hosted runner; retain every check and allow it to finish.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.core_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdstk==1.0.2
      - run: python -u tools/run_python_checks.py core --shard '${{ matrix.shard }}' --shards '${{ matrix.shards }}' --ids-sha '${{ matrix.ids_sha }}'
  kernel-build:
    name: Rebuild retained-precision WebAssembly kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_kernels.py --download-zig --verify
      - run: python tools/build_site.py && python tools/check_kernel_sources.py
  python-tables:
    name: Python · FFT tables · ${{ matrix.label }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.potential_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native FFT and CAP references with live case progress
        run: python -u tools/run_python_checks.py potential --process '${{ matrix.process }}' --frequency '${{ matrix.frequency }}'
  wasm:
    name: WebAssembly · ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, dependencies, resonance, extended, technologies, fft, matrix, contacts, general, spectral, transformer, composition, splitting, storage, geometry, heap, mappings, shared, inductive, prelude, prestorage, libio, cachestore, driverhist, console, nodehistory, commandtransition, signalframes, signalinstall, loaderlookup, pltfixup, loadertransition, dispatchstore, pollstore, stdiotransition, inputtransition, fileallocation, stattransition, mallocstore, malloctransition, readstore, readtransition, capstorage, workspaces, history, filaments, mutual, eddy, metrics]
        include:
          - {suite: erasure, shard: 1, shards: 4}
          - {suite: erasure, shard: 2, shards: 4}
          - {suite: erasure, shard: 3, shards: 4}
          - {suite: erasure, shard: 4, shards: 4}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/reasitic-pyodide pyodide@314.0.7 jsdom@26.1.0
      - name: Run pinned WebAssembly validation group
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          case "$SUITE" in
            baseline|dependencies|resonance)
              node tools/check_pyodide.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs "$SUITE" ;;
            extended)
              node tools/check_extended.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            technologies)
              node tools/check_technologies.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            fft)
              node tools/check_potential_fft.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            matrix)
              node tools/check_matrix_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            contacts)
              node tools/check_contact_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            general)
              node tools/check_general_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            spectral)
              node tools/check_spectral_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            transformer)
              node tools/check_nodes.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_transformer.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_coupling_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_paired_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_remaining_interactive_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_spatial_edits_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_copy_links_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_phase_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_transformer3d_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            composition)
              node tools/check_join_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/audit_join_compiled.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/join-differences.json ;;
            splitting)
              node tools/check_unjoin_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/audit_unjoin_compiled.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/unjoin-differences.json ;;
            storage)
              node tools/check_allocation_plan_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            heap)
              node tools/check_heap_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            geometry)
              node tools/check_geometry_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            mappings)
              node tools/check_mapping_heap_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            shared)
              node tools/check_shared_heap_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            inductive)
              node tools/check_pre_via_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            prelude)
              node tools/check_cap_prelude_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            prestorage)
              node tools/check_prelude_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            libio)
              node tools/check_libio_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            cachestore)
              node tools/check_cache_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            driverhist)
              node tools/check_driver_history_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            console)
              node tools/check_console_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            nodehistory)
              node tools/check_node_history_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            commandtransition)
              node tools/check_command_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/command-transition-main.json /tmp/command-transition-extra.json ;;
            signalframes)
              node tools/check_signal_frames_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            signalinstall)
              node tools/check_signal_install_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            loaderlookup)
              node tools/check_loader_lookup_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            pltfixup)
              node tools/check_plt_fixup_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            loadertransition)
              node tools/check_loader_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            dispatchstore)
              node tools/check_dispatch_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            pollstore)
              node tools/check_poll_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            stdiotransition)
              node tools/check_stdio_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            inputtransition)
              node tools/check_input_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            fileallocation)
              node tools/check_file_allocation_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            stattransition)
              node tools/check_stat_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            mallocstore)
              node tools/check_malloc_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            malloctransition)
              node tools/check_malloc_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            readstore)
              node tools/check_read_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            readtransition)
              node tools/check_read_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            capstorage)
              node tools/check_cap_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            workspaces)
              node tools/check_workspace_storage_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            history)
              node tools/check_storage_history_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            erasure)
              node tools/check_erase_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js "$SHARD" "$SHARDS" ;;
            filaments)
              node tools/check_filaments.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_mesh.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_mesh_inputs_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/audit_mesh_input_assembly.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            mutual)
              node tools/check_mutual_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_vias.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            eddy)
              node tools/check_layered_green.mjs
              node tools/check_eddy_kernels.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs ;;
            metrics)
              node tools/check_assembly_geometry.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_ring_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_radial_interactive_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_square_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_polygon_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_wire_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_symmetric_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_transition_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_symmetric_interactive_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_multimetal_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_inner_dimensions_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_primitive_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_resistance_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_conductor_metrics_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_geometry_metrics_original.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js
              node tools/check_network_metrics.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_pi_sessions.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs
              node tools/check_frequency_inputs.mjs /tmp/reasitic-pyodide/node_modules/pyodide/pyodide.mjs /tmp/reasitic-pyodide/node_modules/jsdom/lib/api.js ;;
            *) exit 1 ;;
          esac
  chrome:
    name: Chrome · worker, erasure, downloads and responsive layout
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/reasitic-chrome pyodide@314.0.7
      - run: node tools/check_erase_chrome.mjs /tmp/reasitic-chrome/node_modules/pyodide /tmp/reasitic-rendered
      - run: node tools/check_join_chrome.mjs /tmp/reasitic-chrome/node_modules/pyodide /tmp/reasitic-rendered/join
      - run: node tools/check_unjoin_chrome.mjs /tmp/reasitic-chrome/node_modules/pyodide /tmp/reasitic-rendered/unjoin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chrome rendering and downloads
          path: /tmp/reasitic-rendered
  deploy:
    name: Deploy validated Pages
    needs: [build, python-core, kernel-build, python-tables, wasm, chrome]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Advance the published version without rollback
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pages_promotion.py
      - name: Deploy
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
